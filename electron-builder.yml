appId: com.tuffahi.app
productName: Tuffahi
copyright: Copyright © 2026 Salama Ashoush

# Use the bundled Castlabs (Widevine) Electron — never re-download upstream.
electronDist: node_modules/electron/dist
npmRebuild: false

directories:
  buildResources: resources
  output: dist-electron

files:
  - out/**/*
  - resources/**/*

# Stable, descriptive artifact names: Tuffahi-0.1.0-linux-x64.AppImage
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: salamaashoush
  repo: tuffahi
  releaseType: release

linux:
  target:
    - AppImage
    - deb
    - pacman
  icon: resources/icons
  category: Audio
  maintainer: Salama Ashoush <salamaashoush@gmail.com>
  synopsis: Cross-platform Apple Music client

# No macOS target — Apple ships a native Apple Music app.

win:
  target:
    - nsis
  icon: resources/icons/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
