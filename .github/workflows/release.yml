name: Release

# Industry standard: tag-driven, multi-OS matrix build. Each runner builds
# its native installers and electron-builder publishes them to the GitHub
# Release for the tag (one release, three platforms' artifacts).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # No macOS — Apple ships a native Apple Music app; a Chromium/
        # Widevine Electron build there adds no value and can't be signed.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux packaging deps
        # fpm's pacman target needs bsdtar (libarchive-tools).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Castlabs Electron (Widevine) binary
        # Bun does not run lifecycle scripts, so the Castlabs Electron
        # postinstall that downloads the platform binary must run explicitly.
        run: node node_modules/electron/install.js

      - name: Build renderer/main/preload
        run: bun run build

      - name: Package & publish
        run: bunx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Windows code signing — set these repo secrets to enable.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # MusicKit developer token is baked at build time by
          # electron.vite.config.ts.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
